name: hospital-management

# Um banco por serviço (ADR-0008). Só scheduling e identity produzem evento, e só
# eles sobem com replicação lógica ligada — sem isso o Debezium não lê o WAL.
#
# Nenhum banco publica porta no host: o acesso é pela rede do Compose. As únicas
# portas publicadas são 8080 (gateway), 8090 (kafbat-ui) e 8025 (mailpit).
#
# O PGDATA do Postgres 18 é /var/lib/postgresql/18/docker, e não mais
# /var/lib/postgresql/data como nas versões anteriores — por isso o volume monta
# o diretório pai. Montar o caminho antigo cria um volume que nunca recebe dado.
#
# Nenhum serviço declara container_name: nome fixo colide com qualquer container
# homônimo já existente na máquina, e o erro só aparece no `up` de quem avalia.
# Com o padrão do Compose os nomes ficam prefixados pelo nome do projeto.

x-postgres-common: &postgres-common
  image: postgres:18-alpine
  environment: &postgres-env
    POSTGRES_USER: ${POSTGRES_USER:-hospital}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s
  restart: unless-stopped

# Replicação lógica: exigida pelo Debezium (ADR-0012), aplicada apenas aos dois
# bancos que têm outbox.
x-postgres-logical: &postgres-logical
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_wal_senders=4
    - -c
    - max_replication_slots=4

services:

  scheduling-db:
    <<: [ *postgres-common, *postgres-logical ]
    environment:
      <<: *postgres-env
      POSTGRES_DB: scheduling
    volumes:
      - scheduling-db-data:/var/lib/postgresql

  identity-db:
    <<: [ *postgres-common, *postgres-logical ]
    environment:
      <<: *postgres-env
      POSTGRES_DB: identity
    volumes:
      - identity-db-data:/var/lib/postgresql

  history-db:
    <<: *postgres-common
    environment:
      <<: *postgres-env
      POSTGRES_DB: history
    volumes:
      - history-db-data:/var/lib/postgresql

  notification-db:
    <<: *postgres-common
    environment:
      <<: *postgres-env
      POSTGRES_DB: notification
    volumes:
      - notification-db-data:/var/lib/postgresql

  # Kafka em modo KRaft, sem Zookeeper (ADR-0004). Nó único: o projeto roda na
  # máquina de quem avalia, então réplica e ISR ficam em 1.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # Debezium Connect em rede interna. O registrador do conector o habilita
  # depois que o Kafka fica saudável, e a topologia KRaft coloca 1 réplica.
  kafka-connect:
    image: quay.io/debezium/connect:3.6.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # O entrypoint do Debezium só reconhece um punhado de nomes curtos; fator
      # de replicação e schema do converter exigem o prefixo CONNECT_, ou a
      # variável é silenciosamente ignorada e o Connect usa o default (3),
      # que não cabe no broker único.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      REST_PORT: "8083"
      ADVERTISED_HOST_NAME: kafka-connect
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Registrador de conectores de uso único: aplica os JSONs em
  # infra/debezium/connectors e termina sem reiniciar.
  connector-registrar:
    build:
      context: ./infra/debezium/registrar
      dockerfile: Dockerfile
    environment:
      CONNECT_URL: http://kafka-connect:8083
      CONNECTORS_DIR: /connectors
    volumes:
      - ./infra/debezium/connectors:/connectors:ro
    depends_on:
      kafka-connect:
        condition: service_healthy
    restart: "no"

  # Console de tópicos e mensagens. É o que torna o pipeline do ticket 18
  # verificável a olho, em vez de por log de aplicação.
  kafbat-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "${KAFBAT_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hospital
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Caixa de e-mail local. A UI é para quem avalia; a API HTTP é o que a
  # collection do Postman usa para extrair o token de ativação (ticket 36).
  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  identity:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: identity
    depends_on:
      identity-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      IDENTITY_DB_URL: ${IDENTITY_DB_URL:-jdbc:postgresql://identity-db:5432/identity}
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
      SERVER_PORT: ${SERVER_PORT:-8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    restart: unless-stopped

  scheduling:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: scheduling
    depends_on:
      scheduling-db:
        condition: service_healthy
    environment:
      SCHEDULING_DB_URL: ${SCHEDULING_DB_URL:-jdbc:postgresql://scheduling-db:5432/scheduling}
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
      SERVER_PORT: ${SERVER_PORT:-8080}
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    restart: unless-stopped

  # Único serviço que publica porta (ADR-0014). Valida o JWT na borda buscando o
  # JWKS do identity (ADR-0013).
  #
  # depends_on sem condition: service_healthy é deliberado: o gateway busca o
  # JWKS de forma preguiçosa, na primeira requisição autenticada, então não
  # precisa do identity de pé no boot. Amarrar por healthcheck acoplaria o boot
  # dos dois sem ganho.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    depends_on:
      - identity
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity:8080/.well-known/jwks.json}
    restart: unless-stopped

volumes:
  scheduling-db-data:
  identity-db-data:
  history-db-data:
  notification-db-data:
  kafka-data:
