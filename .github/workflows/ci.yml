name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9-eclipse-temurin-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test with Maven
        run: mvn -B -ntp verify

      - name: Upload Maven test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            services/*/target/surefire-reports/**
            services/*/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, identity, scheduling, history, notification]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            SERVICE=${{ matrix.service }}
          tags: hospital/${{ matrix.service }}:ci
          cache-from: |
            type=gha,scope=${{ matrix.service }}
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.service }}
