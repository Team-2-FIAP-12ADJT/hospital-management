spring:
  application:
    name: history

  datasource:
    url: ${HISTORY_DB_URL:jdbc:postgresql://history-db:5432/history}
    # local
    #url: ${HISTORY_DB_URL:jdbc:postgresql://localhost:5432/history}
    username: ${POSTGRES_USER:hospital}
    password: ${POSTGRES_PASSWORD:hospital}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  graphql:
    graphiql:
      enabled: true
    path: /graphql

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity:8080/.well-known/jwks.json}
          #Uso local
          #jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:identity}
          audiences: ${JWT_AUDIENCE:hospital-management}
          jws-algorithms: RS256

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
