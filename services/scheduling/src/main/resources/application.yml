spring:
  application:
    name: scheduling

  datasource:
    url: ${SCHEDULING_DB_URL:jdbc:postgresql://scheduling-db:5432/scheduling}
    username: ${POSTGRES_USER:hospital}
    password: ${POSTGRES_PASSWORD:hospital}

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Validação offline do JWT emitido pelo identity (ADR-0013), o mesmo padrão do
  # gateway: jwk-set-uri busca a chave pública uma vez e valida sem chamada
  # síncrona no caminho da request. jws-algorithms fixa o algoritmo aceito.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity:8080/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:identity}
          audiences: ${JWT_AUDIENCE:hospital-management}
          jws-algorithms: RS256

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
