spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity:8080/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:identity}
          audiences: ${JWT_AUDIENCE:hospital-management}
          jws-algorithms: RS256

server:
  port: 8080

gateway:
  routes:
    "[/api/patients]": ${SCHEDULING_URL:http://scheduling:8080}
    "[/api/doctors]": ${SCHEDULING_URL:http://scheduling:8080}
    "[/api/appointments]": ${SCHEDULING_URL:http://scheduling:8080}
    "[/auth]": ${IDENTITY_URL:http://identity:8080}
    "[/.well-known/jwks.json]": ${IDENTITY_URL:http://identity:8080}
    "[/graphql]": ${HISTORY_URL:http://history:8080}
    "[/graphiql]": ${HISTORY_URL:http://history:8080}
  health-services:
    identity: ${IDENTITY_URL:http://identity:8080}
    scheduling: ${SCHEDULING_URL:http://scheduling:8080}
    history: ${HISTORY_URL:http://history:8080}
    notification: ${NOTIFICATION_URL:http://notification:8080}
  api-docs:
    identity: ${IDENTITY_URL:http://identity:8080}
    scheduling: ${SCHEDULING_URL:http://scheduling:8080}
    history: ${HISTORY_URL:http://history:8080}
    notification: ${NOTIFICATION_URL:http://notification:8080}
  proxy-read-timeout: ${GATEWAY_PROXY_READ_TIMEOUT:5s}

springdoc:
  swagger-ui:
    urls:
      - name: identity
        url: /docs/identity
      - name: scheduling
        url: /docs/scheduling
      - name: history
        url: /docs/history
      - name: notification
        url: /docs/notification

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
