spring:
  application:
    name: identity

  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://identity-db:5432/identity}
    username: ${POSTGRES_USER:hospital}
    password: ${POSTGRES_PASSWORD:hospital}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

identity:
  jwt:
    issuer: identity
    audience: hospital-management
    access-token-ttl: PT15M
