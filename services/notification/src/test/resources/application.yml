spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    listener:
      auto-startup: false
    admin:
      # Sem broker no teste, o KafkaAdmin fica ~30s tentando criar os tópicos de
      # DLT (auto-startup=false não desliga a administração de tópicos).
      auto-create: false
  mail:
    host: 127.0.0.1
    port: 3025

# MockitoBean substitui o JavaMailSender; o contributor de health exige o bean real.
management:
  health:
    mail:
      enabled: false
